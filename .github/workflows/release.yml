name: Release

on:
  push:
    tags: ['v*.*.*']
  # Dry run: builds and verifies the ZIP, uploads it as a workflow artifact, creates no release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag against package.json version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-version.mjs "$TAG"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # No --with-deps: the runner image ships the libraries, and apt mirrors are not always reachable.
      - run: npx playwright install chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      # Release build only: "wxt zip" runs a production build, never the e2e mode.
      - name: Build release ZIP
        run: npm run zip
      - name: Verify ZIP manifest
        run: |
          set -euo pipefail
          zips=(.output/*.zip)
          if [ "${#zips[@]}" -ne 1 ] || [ ! -f "${zips[0]}" ]; then
            echo "Expected exactly one ZIP in .output/, found: ${zips[*]}" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/zip-check"
          unzip -p "${zips[0]}" manifest.json > "$RUNNER_TEMP/zip-check/manifest.json"
          node scripts/check-manifest.mjs "$RUNNER_TEMP/zip-check/manifest.json"
          pkg_version=$(node -p "require('./package.json').version")
          zip_version=$(node -p "require(process.argv[1]).version" "$RUNNER_TEMP/zip-check/manifest.json")
          if [ "$pkg_version" != "$zip_version" ]; then
            echo "ZIP manifest version $zip_version differs from package.json version $pkg_version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: .output/*.zip
          if-no-files-found: error
          # .output/ is hidden; upload-artifact skips hidden paths by default.
          include-hidden-files: true

  publish:
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "A release for $TAG already exists. Releases are immutable; use a new version." >&2
            exit 1
          fi
          zips=(dist/*.zip)
          gh release create "$TAG" "${zips[@]}" --repo "$REPO" --verify-tag --title "$TAG" \
            --notes "Unpacked-extension ZIP for $TAG. Load it as an unpacked extension in a Chromium browser."
